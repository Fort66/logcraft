[project]
name = "logcraft"
version = "0.1.0"
description = "Loguru on steroids: smart wrapper with profiling, Rich rendering, and better sinks"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Fort66", email = "mamonov.1966@yandex.ru" }
]
requires-python = ">=3.14"
keywords = ["logging", "profiling", "loguru", "rich", "performance", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Logging",
]
dependencies = [
    "loguru>=0.8.0",
    "pyinstrument>=5.1.3",
    "rich>=13.7.0",
]

[project.scripts]
logcraft = "logcraft:main"

[project.optional-dependencies]
rust = [
    "maturin>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/Fort66/logcraft"
Repository = "https://github.com/Fort66/logcraft"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["logcraft"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["loguru.*", "pyinstrument.*", "rich.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=logcraft --cov-report=term-missing --cov-report=html"