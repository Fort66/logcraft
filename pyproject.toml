[project]
name = "logcraft"
version = "0.1.0"
description = "Loguru on steroids: smart wrapper with profiling, Rich rendering, and better sinks"
readme = "README.md"
authors = [
    { name = "Fort66", email = "mamonov.1966@yandex.ru" }
]
requires-python = ">=3.14"
keywords = ["logging", "profiling", "loguru", "rich", "performance", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]
dependencies = [
    "loguru>=0.8.0",
    "pyinstrument>=5.1.3",
    "rich>=13.7.0",
]

[project.scripts]
logcraft = "logcraft:main"

[project.optional-dependencies]
rust = [
    "maturin>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/Fort66/logcraft"
Repository = "https://github.com/Fort66/logcraft"
Documentation = "https://github.com/Fort66/logcraft#readme"
Issues = "https://github.com/Fort66/logcraft/issues"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

# ============================================================================
# Tool configurations
# ============================================================================

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["logcraft"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["loguru.*", "pyinstrument.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=logcraft --cov-report=term-missing --cov-report=html"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/logcraft"]
omit = [
    "tests/*",
    "examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]